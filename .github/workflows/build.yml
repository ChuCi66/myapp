name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Build with Gradle (Aliyun Mirror)
      run: |
        sed -i 's|https://repo.maven.apache.org/maven2|https://maven.aliyun.com/repository/public|g' build.gradle
        sed -i 's|https://dl.google.com/dl/android/maven2|https://maven.aliyun.com/repository/google|g' build.gradle
        gradle wrapper --gradle-version 7.6
        ./gradlew assembleDebug --no-daemon
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
